  description: "Hardened RT4 teachers on patient 202 after the robustness check showed that with 5 Hz of added background spikes the teachers_round4 policies stimulate constantly (they key on silent striatal D2 in healthy windows): RT4bg = observation restricted to STN/GPe/GPi (lead-realistic); RT4n = 5 Hz Poisson spikes added during training; RT4bgn = both"
