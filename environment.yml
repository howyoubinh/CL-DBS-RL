name: cl-dbs-rl
channels:
  - conda-forge
dependencies:
  - python=3.9
  - numpy=1.26.2
  - scipy=1.11.4
  - pandas=2.1.3
  - matplotlib=3.8.2
  - numba=0.59.0
  - tqdm=4.66.*
  - pip
  - pip:
      # Core RL / spiking stack
      - torch==2.3.1
      - gymnasium==0.29.1
      - rockpool==3.0.1
      - pyyaml==6.0.1
      - wandb==0.21.1
      # XyloAudio 3: samna is needed to import Rockpool's Xylo modules (XyloSim included);
      # the development kit itself is needed only for the on-chip measurements
      - samna==0.48.0
      - xylosim==0.1.3
      # Microcontroller export only (TFLite int8 model)
      # - tensorflow-cpu==2.20.0
